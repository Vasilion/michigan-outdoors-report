name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_URL: https://michiganoutdoorsreport.com

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (includes no-comments, explicit types, no-async rules)
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Data integrity
        run: pnpm exec tsx scripts/data-integrity.ts

      - name: Build static site
        run: pnpm build

      - name: SEO checks on out/
        run: pnpm check:seo

      - name: Internal link and orphan checks
        run: pnpm check:links

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Lighthouse CI
        run: pnpm exec lhci autorun

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: |
            reports/build-report.json
            .lighthouseci/assertion-results.json
          if-no-files-found: ignore
          retention-days: 14
