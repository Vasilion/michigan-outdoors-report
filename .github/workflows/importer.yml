name: Importers

on:
  schedule:
    - cron: "0 11 * * *"
    - cron: "0 12 1 * *"
  workflow_dispatch:
    inputs:
      importers:
        description: Space-separated importer directories to run
        required: true
        default: harvest
        type: string

concurrency:
  group: importers
  cancel-in-progress: false

env:
  SITE_URL: https://michiganoutdoorsreport.com

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Decide which importers this run covers
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "list=${{ inputs.importers }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 12 1 * *" ]; then
            echo "list=counties public-lands curated harvest" >> "$GITHUB_OUTPUT"
          else
            echo "list=harvest" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip cleanly until a database exists
        id: guard
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is not set yet, so there is nothing to import against."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        if: steps.guard.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        if: steps.guard.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate

      - name: Run importers
        if: steps.guard.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IMPORTER_CONTACT_EMAIL: ${{ secrets.IMPORTER_CONTACT_EMAIL }}
        run: |
          for importer in ${{ steps.plan.outputs.list }}; do
            echo "::group::$importer"
            pnpm exec tsx "importers/$importer/run.ts"
            echo "::endgroup::"
          done

      - name: Export snapshot
        if: steps.guard.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:snapshot

      - name: Data integrity gate
        if: steps.guard.outputs.ready == 'true'
        run: pnpm exec tsx scripts/data-integrity.ts

      - name: Commit snapshot when it changed
        if: steps.guard.outputs.ready == 'true'
        run: |
          if git diff --quiet -- data; then
            echo "snapshot unchanged, nothing to commit"
          else
            git config user.name "michigan-outdoors-bot"
            git config user.email "bot@michiganoutdoorsreport.com"
            git add data
            git commit -m "data: ${{ steps.plan.outputs.list }} snapshot $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Open an issue when an importer fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Importer run failed: ${{ steps.plan.outputs.list }}`;
            const body = [
              `Importers \`${{ steps.plan.outputs.list }}\` failed on run ${context.runId}.`,
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'The snapshot was not committed, so the live site still serves the last good data.',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'importer-failure',
            });
            const match = existing.data.find((issue) => issue.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['importer-failure'],
              });
            }
