categories:
  - slug: deer-hunting
    name: Deer Hunting Gear
    title: Deer Hunting Gear for Michigan
    intro: >-
      Michigan's firearm season opens November 15 in weather that runs from 50 degrees and
      raining to single digits and blowing snow, often in the same week. Lower Peninsula
      hunters sit more private-land edge cover; Upper Peninsula hunters cover more ground on
      big blocks of state forest. The picks below are organized around those two realities.
    speciesSlugs:
      - deer
  - slug: turkey-hunting
    name: Turkey Hunting Gear
    title: Turkey Hunting Gear for Michigan
    intro: >-
      Michigan's spring turkey seasons run through cold, wet mornings in April and warm,
      green-up mornings in May, and most public-land hunting here is run-and-gun in hardwoods
      rather than sitting a field edge. Light, packable gear matters more than volume.
    speciesSlugs:
      - turkey
  - slug: small-game
    name: Small Game Gear
    title: Small Game Hunting Gear for Michigan
    intro: >-
      Rabbit, hare, squirrel, grouse and woodcock seasons in Michigan stretch from September
      into March, which means the same hunter needs early-season brush protection and
      late-season snow gear. Most of this list is about staying mobile in thick cover.
    speciesSlugs:
      - cottontail-rabbit
      - snowshoe-hare
      - squirrel
      - ruffed-grouse
      - woodcock
  - slug: ice-fishing
    name: Ice Fishing Gear
    title: Ice Fishing Gear for Michigan
    intro: >-
      Michigan ice seasons vary by latitude more than almost any other state: inland lakes in
      the Upper Peninsula can hold safe ice for four months while southern Lower Peninsula
      lakes may only give six workable weeks. Gear that travels well between both is worth
      more than gear built for one.
    speciesSlugs:
      - walleye
      - yellow-perch
      - bluegill
      - northern-pike
  - slug: trout-and-stream
    name: Trout and Stream Fishing Gear
    title: Trout and Stream Fishing Gear for Michigan
    intro: >-
      Michigan has thousands of miles of designated trout stream and a few dozen Blue Ribbon
      reaches, most of them cold, clear, and tighter than the water these rods usually get
      marketed for. Wading gear and line control matter more here than casting distance.
    speciesSlugs:
      - brook-trout
      - brown-trout
      - rainbow-trout
  - slug: walleye-and-panfish
    name: Walleye and Panfish Gear
    title: Walleye and Panfish Gear for Michigan
    intro: >-
      Between Saginaw Bay, the Detroit River, Lake Erie's western basin and several hundred
      stocked inland lakes, Michigan open-water walleye fishing covers trolling, jigging and
      drifting. Panfish gear overlaps heavily, so this list covers both.
    speciesSlugs:
      - walleye
      - yellow-perch
      - bluegill
      - largemouth-bass
      - smallmouth-bass

products:
  - slug: blaze-orange-vest
    name: Blaze Orange Hunting Vest
    brand: null
    category: deer-hunting
    network: amazon
    asin: null
    url: null
    priceBand: under-50
    why: >-
      Michigan law requires hunters to wear a hat, cap, vest, jacket, rain gear or coat of
      hunter orange during firearm deer season, and the orange must be the outermost garment
      and visible from all sides. A vest is the cheapest way to stay legal over whatever else
      you are already wearing.
    michiganNote: >-
      Camouflage patterns of hunter orange are legal in Michigan as long as at least 50
      percent of the surface area is hunter orange.
